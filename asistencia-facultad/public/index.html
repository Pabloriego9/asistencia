<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Metadatos básicos para codificación, adaptación móvil y título de la pestaña. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencia</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Contenedor principal de la pantalla de registro. -->
    <div class="card">
        <h2>Registro de Asistencia</h2>

        <!--
            El formulario aplica restricciones básicas directamente en el navegador
            para dar feedback inmediato. El servidor repite estas validaciones porque
            las reglas HTML pueden omitirse al llamar directamente a la API.
        -->
        <form id="attendanceForm">
            <div class="input-group">
                <label for="nombre">Nombre</label>
                <!-- Unicode Letter acepta letras con tildes y ñ; el límite incluye espacios. -->
                <input type="text" id="nombre" name="nombre" required minlength="2" maxlength="50"
                    pattern="[\p{L} ]{2,50}" title="Usa solo letras y espacios (de 2 a 50 caracteres)."
                    autocomplete="given-name" placeholder="Ej. Juan">
            </div>
            
            <div class="input-group">
                <label for="apellido">Apellido</label>
                <!-- Mantiene las mismas reglas que el campo Nombre. -->
                <input type="text" id="apellido" name="apellido" required minlength="2" maxlength="50"
                    pattern="[\p{L} ]{2,50}" title="Usa solo letras y espacios (de 2 a 50 caracteres)."
                    autocomplete="family-name" placeholder="Ej. Pérez">
            </div>

            <div class="input-group">
                <label for="dni">DNI</label>
                <!-- Texto, no number, para mantener ceros iniciales; inputmode abre teclado numérico. -->
                <input type="text" id="dni" name="dni" required minlength="8" maxlength="8"
                    pattern="[0-9]{8}" inputmode="numeric" title="El DNI debe contener exactamente 8 dígitos."
                    autocomplete="off" placeholder="Ej. 12345678">
            </div>

            <!-- script.js intercepta el envío, serializa los campos y llama a la API. -->
            <button type="submit">Marcar Presente</button>
        </form>

            <!-- script.js escribe aquí los mensajes usando textContent, no como HTML. -->
            <div id="mensaje" class="mensaje"></div>

            <!-- El checkbox filtra la exportación y el botón genera el archivo XLSX. -->
            <div class="export-group">
                <label><input type="checkbox" id="soloHoy"> Solo la asistencia de hoy</label>
                
                <button id="exportExcelBtn" class="btn">Exportar a Excel (.xlsx)</button>
            </div>
    </div>

        <!-- SheetJS está disponible globalmente como XLSX para generar el archivo en el cliente. -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
        <!-- Lógica de envío del formulario y exportación de asistencias. -->
        <script src="script.js"></script>
</body>
</html>
